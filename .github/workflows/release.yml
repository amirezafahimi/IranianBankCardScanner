name: Release

# Publishes to the Maven Central Portal when a version tag is pushed.
#
# The upload runs here rather than on a developer machine so that the signing key and the portal
# token live only in GitHub secrets, and so publishing does not depend on local network access to
# central.sonatype.com.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME   - user token name from central.sonatype.com
#   MAVEN_CENTRAL_PASSWORD   - user token password
#   SIGNING_KEY              - ASCII-armored private PGP key (gpg --armor --export-secret-keys)
#   SIGNING_PASSWORD         - passphrase of that key
#
# See PUBLISHING.md for how to obtain each one.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :cardscanner:test

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :cardscanner:publishToMavenCentral --no-configuration-cache
