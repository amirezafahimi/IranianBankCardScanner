name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :cardscanner:test

      - name: Assemble library
        run: ./gradlew :cardscanner:assembleRelease

      # Maven Central rejects a deployment without a javadoc jar, and Dokka — which generates it —
      # only runs during publishing. Building it here means a broken javadoc jar surfaces on an
      # ordinary push instead of halfway through a release.
      #
      # Both Dokka output formats are built because the javadoc jar is wired to one of them
      # depending on the publish plugin's version; they share the same Dokka pipeline over the same
      # source set, so this covers the jar either way.
      - name: Javadoc jar
        run: ./gradlew :cardscanner:dokkaJavadoc :cardscanner:dokkaHtml

      - name: List the Dokka and publishing tasks
        if: failure()
        run: ./gradlew :cardscanner:tasks --all | grep -iE 'dokka|javadoc|publish' || true
